<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
 <meta name="mobile-web-app-capable" content="yes">
 <script>
  try {
   if(location.hash.startsWith('#look=') || localStorage.getItem('wallet-appearance-v1:'+new URL('./',location.href).pathname))document.documentElement.classList.add('wallet-opening');
  } catch {}
 </script>
 <meta name="theme-color" content="#fafafa">
 <meta name="referrer" content="no-referrer">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-title" content="Wise">
 <title>Wise Wallet</title>
 <link rel="manifest" href="./install.webmanifest">
 <link rel="apple-touch-icon" sizes="180x180">
 <link rel="icon" href="./icon.svg">
 <link rel="stylesheet" href="./style.css">
 <link rel="stylesheet" href="./video.css">
 <link rel="preload" href="./inter-latin.woff2" as="font" type="font/woff2" crossorigin>
 <link rel="stylesheet" href="./mobile.css">
 <script src="./mobile.js" defer></script>
 <script src="./install-identity.js" defer></script>
 <script src="./appearance.js" defer></script>
 <script src="./video.js" defer></script>
 <script src="./wallet-controls.js" defer></script>
 <script src="./biometrics.js" defer></script>
 <script src="./app.js" defer></script>
</head>
<body>
 <div id="launch-cover" aria-hidden="true"><i class="launch-mark"></i><i class="launch-tail"></i><i class="launch-ribbon"></i></div>
 <main id="app"></main>
 <input type="file" id="appearance-file" accept=".json,application/json" hidden>
 <dialog id="sheet"><form id="editor">
  <div class="handle"></div><header><h2 id="sheetTitle"></h2><button type="button" id="close" aria-label="Close">×</button></header>
  <div id="fields"></div><p id="error" role="alert"></p><button class="primary" id="save">Save changes</button>
 </form></dialog>
</body>
</html>
