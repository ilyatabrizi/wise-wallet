name: Wallet browser checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save --prefix /tmp/wallet-check playwright@1.58.2
      - name: Make an isolated site and run mobile browser tests
        run: |
          mkdir -p /tmp/wallet-site/wallet
          cp *.js *.css *.html *.webmanifest *.svg *.png *.woff2 /tmp/wallet-site/wallet/
          node tests/browser-check.cjs /tmp/wallet-site /tmp/wallet-check/node_modules/playwright
      - name: Verify the published Pages files
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          for asset in index.html install.html install.webmanifest manifest.webmanifest sw.js install-identity.js appearance.js app.js video.js video.css wallet-controls.js mobile.js mobile.css inter-latin.woff2 personal-layout-v3.bin; do
            curl --fail --silent --show-error --retry 3 "https://${GITHUB_REPOSITORY_OWNER}.github.io/wise-wallet/${asset}?build=${GITHUB_SHA}" -o /tmp/published-file
            cmp "$asset" /tmp/published-file
          done
